services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Novosibirsk
      - TZ=Asia/Novosibirsk
      - N8N_SECURE_COOKIE=false
      # сценарии читают секреты из окружения ($env.B24_WEBHOOK), а не хранят их в себе — иначе секрет уйдёт с выгрузкой
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    env_file:
      - path: .env          # B24_WEBHOOK=… (в .gitignore)
        required: false
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
